name: Build and deploy blog

on:
  push:
    branches: [main]
    paths:
      - 'personal-blog/**'
      - '.github/workflows/blog.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: blog-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate OG cards
        working-directory: personal-blog
        run: node og-generator.js

      - name: Build site
        working-directory: personal-blog
        run: node build.mjs

      - name: Publish generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: personal-blog/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
