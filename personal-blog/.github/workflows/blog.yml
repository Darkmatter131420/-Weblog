name: Build blog

on:
  push:
    branches: [main]
    paths:
      - 'personal-blog/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-blog
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static site
        run: node build.mjs
      - name: Publish generated site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add personal-blog/site
          git diff --cached --quiet || git commit -m 'chore: rebuild blog site'
          git push
